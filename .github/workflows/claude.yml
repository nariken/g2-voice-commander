name: Claude Code

# Stage 3: a spoken "○○を実装して" → the Worker opens a GitHub issue that
# @claude-mentions this action → Claude Code implements on a new branch and
# opens a PR (never pushes to main). Fires only when text contains @claude.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          # Claude subscription OAuth token (runs within your plan — no metered API cost).
          # Generate with `claude setup-token`, then add as the repo secret below.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --model claude-sonnet-5
